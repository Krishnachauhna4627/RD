<div class="shell">
  <aside class="sidebar" [class.is-open]="sidebarOpen()">
    <a class="sidebar__brand" routerLink="/">
      <img src="images/logo.svg" alt="RD Enterprises" width="112" height="49" />
    </a>

    <nav class="sidebar__nav" aria-label="Dashboard">
      @for (link of links; track link.path) {
        <a
          class="navitem"
          [routerLink]="link.path"
          routerLinkActive="is-active"
          (click)="closeSidebar()"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path [attr.d]="link.icon" />
          </svg>
          {{ link.label }}
        </a>
      }
    </nav>

    <button class="navitem navitem--logout" type="button" (click)="logout()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 17l5-5-5-5M20 12H9M12 20H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h6" />
      </svg>
      Logout
    </button>
  </aside>

  @if (sidebarOpen()) {
    <button class="sidebar__scrim" type="button" tabindex="-1" aria-hidden="true" (click)="closeSidebar()"></button>
  }

  <div class="main">
    <header class="topbar">
      <button
        class="topbar__burger"
        type="button"
        [attr.aria-expanded]="sidebarOpen()"
        aria-label="Toggle menu"
        (click)="toggleSidebar()"
      >
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" aria-hidden="true">
          <path d="M3 6h18M3 12h18M3 18h18" />
        </svg>
      </button>

      <span class="topbar__spacer"></span>

      <div class="topbar__user">
        <span class="topbar__avatar" aria-hidden="true">{{ initial() }}</span>
        <span class="topbar__meta">
          <span class="topbar__name">{{ user()?.username }}</span>
          <span class="topbar__role">{{ user()?.role }}</span>
        </span>
      </div>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
