<section class="why section" id="why">
  <div class="container">
    <p class="eyebrow">Why Choose Us</p>
    <h2 class="why__title">Why Choose RD Enterprises?</h2>

    <ul class="why__grid">
      @for (reason of reasons; track reason.title) {
        <li class="reason">
          <span class="reason__icon" aria-hidden="true">
            @switch (reason.icon) {
              @case ('diamond') {
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--green)"
                     stroke-width="1.5" stroke-linejoin="round">
                  <path d="M7 4h10l4 5-9 11L3 9z" /><path d="M3 9h18M9.5 4 7 9l5 11 5-11-2.5-5" />
                </svg>
              }
              @case ('rupee') {
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--green)"
                     stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M8 5h8M8 8.5h8M13 5c1.8 0 2.8 1.2 2.8 2.4 0 2-2 3-4.3 3L16.5 19" />
                </svg>
              }
              @case ('truck') {
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--green)"
                     stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 6.5h11v9H2zM13 9.5h4.2l2.8 3.2v2.8h-7z" />
                  <circle cx="6.5" cy="17.5" r="1.8" /><circle cx="16.5" cy="17.5" r="1.8" />
                </svg>
              }
              @default {
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--green)"
                     stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="8.5" r="3.4" />
                  <path d="M5 19c0-3.4 3.1-5.5 7-5.5s7 2.1 7 5.5" />
                </svg>
              }
            }
          </span>
          <div class="reason__body">
            <h3 class="reason__title">{{ reason.title }}</h3>
            <p class="reason__text">{{ reason.text }}</p>
          </div>
        </li>
      }
    </ul>
  </div>
</section>
