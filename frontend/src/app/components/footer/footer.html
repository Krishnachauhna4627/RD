<footer class="footer">
  <div class="container footer__inner">
    <div class="footer__brand">
      <img src="images/logo.svg" alt="RD Enterprises" width="110" height="48" />
      <p class="footer__tagline">Reliable Products. Better Tomorrow.</p>
    </div>

    <nav class="footer__nav" aria-label="Footer">
      @for (link of links; track link.href) {
        <a class="footer__link" [href]="link.href">{{ link.label }}</a>
      }
    </nav>

    <ul class="social">
      <li>
        <a class="social__link" href="#contact" aria-label="RD Enterprises on Facebook">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 2a10 10 0 1 0-1.6 19.9v-7h-2.5V12h2.5V9.8c0-2.5 1.5-3.9 3.7-3.9 1.1 0 2.2.2 2.2.2v2.4h-1.2c-1.2 0-1.6.8-1.6 1.6V12h2.7l-.4 2.9h-2.3v7A10 10 0 0 0 12 2Z" />
          </svg>
        </a>
      </li>
      <li>
        <a class="social__link" href="#contact" aria-label="RD Enterprises on WhatsApp">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2Zm5.3 14c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-1.7-.1a12 12 0 0 1-5.6-4.9c-.4-.6-.9-1.5-.9-2.4s.5-1.5.7-1.7c.2-.2.4-.3.6-.3h.5c.2 0 .4 0 .6.5l.8 1.9c.1.2 0 .4-.1.5l-.4.5c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.1 1 2 1.3 2.3 1.5.3.1.5.1.6-.1l.7-.9c.2-.2.4-.2.6-.1l1.8.9c.2.1.4.2.4.3v.5Z" />
          </svg>
        </a>
      </li>
      <li>
        <a class="social__link" href="#contact" aria-label="RD Enterprises on LinkedIn">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M20 2H4a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2ZM8.3 18.5H5.8V9.8h2.5v8.7ZM7 8.7a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Zm11.3 9.8h-2.5v-4.3c0-1.1-.4-1.8-1.4-1.8-.7 0-1.2.5-1.4 1a2 2 0 0 0-.1.7v4.4h-2.5V9.8h2.5V11a2.6 2.6 0 0 1 2.3-1.3c1.7 0 3 1.1 3 3.5v5.3Z" />
          </svg>
        </a>
      </li>
      <li>
        <a class="social__link" href="#contact" aria-label="RD Enterprises on Instagram">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" clip-rule="evenodd"
                  d="M7.5 2h9A5.5 5.5 0 0 1 22 7.5v9a5.5 5.5 0 0 1-5.5 5.5h-9A5.5 5.5 0 0 1 2 16.5v-9A5.5 5.5 0 0 1 7.5 2Zm0 2A3.5 3.5 0 0 0 4 7.5v9A3.5 3.5 0 0 0 7.5 20h9a3.5 3.5 0 0 0 3.5-3.5v-9A3.5 3.5 0 0 0 16.5 4h-9Zm4.5 3.7a4.3 4.3 0 1 1 0 8.6 4.3 4.3 0 0 1 0-8.6Zm0 2a2.3 2.3 0 1 0 0 4.6 2.3 2.3 0 0 0 0-4.6Zm4.7-3.2a1.15 1.15 0 1 1 0 2.3 1.15 1.15 0 0 1 0-2.3Z" />
          </svg>
        </a>
      </li>
    </ul>

    <p class="footer__copy">&copy; {{ year }} RD Enterprises. All Rights Reserved.</p>
  </div>
</footer>
