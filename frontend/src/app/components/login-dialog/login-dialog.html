<div class="login">
  <button class="login__scrim" type="button" tabindex="-1" aria-hidden="true" (click)="close()"></button>

  <div class="login__card" role="dialog" aria-modal="true" aria-labelledby="login-title">
    <button class="login__close icon-btn" type="button" aria-label="Close login" (click)="close()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" aria-hidden="true">
        <path d="M18 6 6 18M6 6l12 12" />
      </svg>
    </button>

    <h2 class="login__title" id="login-title">Sign in</h2>
    <p class="login__text">Access your RD Enterprises account.</p>

    @if (error()) {
      <p class="login__error" role="alert">{{ error() }}</p>
    }

    <form class="login__form" (ngSubmit)="submit()">
      <label class="field">
        <span class="field__label">Username</span>
        <input
          class="field__input"
          type="text"
          name="username"
          autocomplete="username"
          placeholder="Enter your username"
          required
          [disabled]="submitting()"
          [ngModel]="username()"
          (ngModelChange)="username.set($event)"
        />
      </label>

      <label class="field">
        <span class="field__label">Password</span>
        <span class="field__wrap">
          <input
            class="field__input"
            [type]="showPassword() ? 'text' : 'password'"
            name="password"
            autocomplete="current-password"
            placeholder="Enter your password"
            required
            [disabled]="submitting()"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
          />
          <button
            class="field__toggle"
            type="button"
            [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
            (click)="togglePassword()"
          >
            @if (showPassword()) {
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8" />
                <path d="M6.7 6.8C4.6 8.1 3 10 2 12c2 3.8 5.6 6 10 6 1.8 0 3.4-.4 4.8-1.1" />
                <path d="M9.9 6.2A9.9 9.9 0 0 1 12 6c4.4 0 8 2.2 10 6-.9 1.7-2.1 3.1-3.5 4.1" />
              </svg>
            } @else {
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12c2-3.8 5.6-6 10-6s8 2.2 10 6c-2 3.8-5.6 6-10 6s-8-2.2-10-6Z" />
                <circle cx="12" cy="12" r="2.6" />
              </svg>
            }
          </button>
        </span>
      </label>

      <button class="btn btn--primary login__submit" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Signing in…' : 'Login' }}
      </button>
    </form>
  </div>
</div>
